name: iOS probe

# Feasibility probe: builds a SwiftUI app on a GitHub-hosted macOS runner, runs
# it in the iOS Simulator, drives it with XCUITest and uploads screenshots.
# This is the loop that stands in for a local Xcode — the agent's own container
# is Linux, where Xcode and the Simulator cannot run at all.

on:
  push:
    branches:
      - claude/web-chess-local-multiplayer-nlfp6f
    paths:
      - 'ios-probe/**'
      - '.github/workflows/ios-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-probe
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios-probe

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          sw_vers
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          # simctl lists runtimes oldest first, so the last iPhone line belongs
          # to the newest installed iOS.
          xcrun simctl list devices available
          LINE=$(xcrun simctl list devices available | grep -E '^[[:space:]]+iPhone' | tail -1)
          UDID=$(printf '%s\n' "$LINE" | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          if [ -z "$UDID" ]; then echo "no iPhone simulator available"; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Selected:$LINE"

      # xcodebuild owns the simulator lifecycle here. Booting it by hand with
      # `simctl bootstatus` hung for over ten minutes on the runner, and the
      # test action boots, installs and launches on its own anyway.
      - name: Build and test in the simulator
        run: |
          mkdir -p ../shots
          set -o pipefail
          xcodebuild test \
            -project ProbeApp.xcodeproj \
            -scheme ProbeApp \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -resultBundlePath ../shots/Result.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -80

      - name: Export the screenshots the test attached
        if: always()
        run: |
          xcrun xcresulttool export attachments \
            --path ../shots/Result.xcresult \
            --output-path ../shots/attachments \
            || echo "attachment export failed on this Xcode version"
          # Best effort raw grab; harmless if the device already shut down.
          xcrun simctl io booted screenshot ../shots/simctl-final.png || true
          find ../shots -maxdepth 3 -type f | head -40

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-screenshots
          path: shots
          retention-days: 7
