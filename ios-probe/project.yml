# XcodeGen spec — the .xcodeproj is generated on the runner, so nothing
# Xcode-specific has to be committed or hand-edited.
name: ProbeApp
options:
  bundleIdPrefix: dev.airplanechess
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    SWIFT_VERSION: "5.0"

targets:
  ProbeApp:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Probe
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

  ProbeAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: ProbeApp

schemes:
  ProbeApp:
    build:
      targets:
        ProbeApp: all
        ProbeAppUITests: [test]
    test:
      targets:
        - ProbeAppUITests
